[project]
name = "rag-app"
version = "0.1.0"
description = "RAG application with LangChain, LangGraph, Claude and Postgres (pgvector)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-postgres>=0.0.19",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "anthropic>=0.40",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=6.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "langchain-google-genai>=4.5.0",
    "httpx>=0.28.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7", "httpx>=0.27"]
