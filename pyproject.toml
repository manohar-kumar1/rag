[project]
name = "rag-app"
version = "0.1.0"
description = "RAG application with LangChain, LangGraph, Claude and Postgres (pgvector)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-postgres>=0.0.12",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7", "httpx>=0.27"]
